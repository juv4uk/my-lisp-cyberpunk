name: Windows host verification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Test host runtime
        working-directory: host-runtime
        run: cargo test -- --test-threads=1

      - name: Build release runtime
        working-directory: host-runtime
        run: cargo build --release

      - name: Build canonical my-lisp runtime
        # adapter's observation-contract-fixtures CTest (#28) shells out to
        # this binary's --oracle-check; it must exist before ctest runs.
        run: ./tools/build-my-lisp-runtime.ps1

      - name: Configure vanilla bridge
        run: cmake -S bridge -B bridge/build

      - name: Build vanilla bridge and harness
        run: cmake --build bridge/build --config Release --parallel 4

      - name: Stage canonical embed and real system version.dll
        shell: pwsh
        run: |
          Copy-Item "$env:WINDIR\System32\version.dll" "bridge\build\Release\version-original.dll"
          Copy-Item "runtime\my-lisp\target\release\my_lisp_embed.dll" "bridge\build\Release\my_lisp_embed.dll"

      - name: Prove vanilla bridge owns one persistent canonical REPL session
        shell: pwsh
        run: >-
          & .\bridge\build\Release\bridge-load-test.exe
          .\bridge\build\Release\version.dll

      - name: Configure RED4ext adapter
        run: cmake -S adapter -B adapter/build

      - name: Build release adapter
        run: cmake --build adapter/build --config Release --parallel 4

      - name: Test generated host-operation registry
        run: ctest --test-dir adapter/build -C Release --output-on-failure

      - name: Prove canonical Lisp dispatch
        shell: pwsh
        run: >-
          & .\adapter\build\src\Release\my-lisp-cyberpunk-dispatch-witness.exe
          .\host-runtime\target\release\wsm_my_lisp_cyberpunk_dll.dll
          .\scripts\scenario-log.lisp
          .\scripts\scenario-silent.lisp
