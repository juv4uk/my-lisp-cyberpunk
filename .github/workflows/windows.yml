name: Windows host runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test checked embedded Lisp boundary
        working-directory: host-runtime
        run: cargo test
      - name: Configure adapter
        run: cmake -S adapter -B adapter/build -G "Visual Studio 17 2022" -A x64
      - name: Build adapter
        run: cmake --build adapter/build --config Release
      - name: Run adapter witnesses
        run: ctest --test-dir adapter/build -C Release --output-on-failure
