name: Windows host runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test checked embedded Lisp boundary
        working-directory: host-runtime
        run: cargo test
      - name: Configure adapter
        # windows-latest no longer guarantees a Visual Studio generator. Let
        # CMake choose the runner-supported generator, as the verification
        # workflow does, rather than failing before the adapter is configured.
        run: cmake -S adapter -B adapter/build
      - name: Build adapter
        run: cmake --build adapter/build --config Release --parallel 4
      - name: Run adapter witnesses
        run: ctest --test-dir adapter/build -C Release --output-on-failure
